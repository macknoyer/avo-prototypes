<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Калькулятор">
<meta name="theme-color" content="#f1f2f5">
<title>Калькулятор микрозайма 4.0</title>
<meta name="description" content="Калькулятор микрозайма 4.0: одобренная сумма, ввод суммы, выбор срока. Прототип 1:1 по Figma «Калькулятор 4.0».">
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/proto.css">
<link rel="stylesheet" href="kit/components.css">
<style>
  html{--frame-r:30px}
  /* KL_offer */
  .offer{display:flex;flex-direction:column;gap:24px;align-items:center;padding:16px 16px 24px}
  .terms{display:flex;flex-direction:column;gap:12px;width:100%}
  .terms-list{display:flex;flex-direction:column;gap:16px;width:100%}
  .group-label{width:100%;font-size:16px;line-height:22px;color:var(--text-neutral-bold600)}
</style>
</head>
<body>
<div class="device">

  <!-- ============ 68516:39019 / 41004 / 39117 · Ваше предложение ============ -->
  <section class="screen" id="s-offer" data-title="Ваше предложение">
    <header class="appbar">
      <div class="statusbar"></div>
      <div class="appbar-actions">
        <div class="appbar-title title-small-semibold nowrap">Ваше предложение</div>
        <button class="appbar-left" data-back aria-label="Назад"><img class="ic24" src="assets/chevron-left.svg" alt=""></button>
      </div>
    </header>
    <div class="scroll">
      <div class="offer">
        <div class="status-colored sc-positive">
          <img class="ic24" src="assets/money.svg" alt="">
          <div class="sc-content"><p class="sc-title" id="approved-title">10 000 000 UZS уже одобрены!</p><p class="sc-sub">Выбери сумму займа и подберите удобный ежемесячный платеж</p></div>
        </div>
        <div class="input">
          <label class="input-label" for="amount">Одобреная сумма</label>
          <div class="input-text no-hint">
            <input id="amount" type="text" inputmode="numeric" data-kb="numeric" autocomplete="off" enterkeyhint="done" maxlength="15" value="10 000 000">
            <span class="it-icon"><img src="assets/edit.svg" alt=""></span>
          </div>
        </div>
        <div class="terms">
          <p class="group-label">Срок займа</p>
          <div class="terms-list" id="terms"></div>
        </div>
      </div>
    </div>
    <div class="footer btn-combo is-white">
      <div class="btn-combo-buttons">
        <p class="slot" id="slot">Вы оформляете микрозайм на сумму {сумма} UZS</p>
        <div class="btn-group-v"><button class="btn btn-l btn-primary" id="get-money">Получить деньги</button></div>
        <p class="checkbox-confirm">Нажимая кнопку {buttonName} я даю согласие на <a>получение кредитного отчета из кредитного бюро</a></p>
      </div>
      <div class="home-indicator"></div>
    </div>
  </section>
</div>

<script src="kit/proto.js"></script>
<script>
const P = Proto;
const $ = s => document.querySelector(s);
const input = $('#amount');

// Сроки и их доступность — правила «Rule dev» из «Калькулятор 3.0» (Figma 55845:95107):
//   1–2 млн → 36, 24, 12, 6, 3 · 3 млн → 36, 24, 12, 6 · 4 млн → 36, 24, 12 · 7 млн → 36, 24 · 10 млн → 36.
// Исключение: при 10 млн оставлен срок 24 месяца — так в кадре 4.0 «по умолчанию» (68516:39019).
// Платёж = сумма × коэффициент; коэффициенты — платежи из макета на 10 000 000 (4.0: 36/24 мес., 3.0 кадр 55845:95296: 12/6/3 мес.).
const TERMS = [
  { m: 36, label: '36 месяцев', pay: 144000, max: Infinity },
  { m: 24, label: '24 месяца',  pay: 183000, max: 10000000 },
  { m: 12, label: '12 месяцев', pay: 307000, max: 4000000 },
  { m: 6,  label: '6 месяцев',  pay: 370000, max: 3000000 },
  { m: 3,  label: '3 месяца',   pay: 711000, max: 2000000 },
];
const termsFor = amount => TERMS.filter(t => amount <= t.max);
const payFor = (t, amount) => Math.round(amount * t.pay / 10000000 / 1000) * 1000;
const SCEN = { A: { approved: 10000000 }, B: { approved: 2000000 } };  // B — кадр 4.0 68516:39117
const S = { scen: 'A', amount: 10000000, term: 36, loading: false, editing: false };
let lastValid = S.amount;

function render() {
  const sc = SCEN[S.scen];
  $('#approved-title').textContent = `${P.fmt(sc.approved)} UZS уже одобрены!`;
  if (document.activeElement !== input) input.value = S.amount ? P.fmt(S.amount) : '';
  $('#slot').textContent = `Вы оформляете микрозайм на сумму ${P.fmt(S.amount || 0)} UZS`;
  const list = termsFor(S.amount);
  if (!list.some(t => t.m === S.term)) S.term = list[0].m;
  P.list($('#terms'), list, t => t.m, t => {
    const on = t.m === S.term && !S.editing;
    const val = S.loading ? 'sk' : String(payFor(t, S.amount));
    return `<div class="cwl-concept" data-act="term" data-m="${t.m}">
      <img class="radio" src="assets/radio-${on ? 'on' : 'off'}.svg" alt="" data-swap="${on}" data-swap-anim="pop">
      <div class="cc-content">
        <p class="cc-label">${t.label}</p>
        <div class="cc-row"><span class="cc-row-label">Ежемесячный платеж</span>
          <span class="cc-sum" data-swap="${val}"${S.loading ? ' style="visibility:hidden"' : ''}><span class="num">${P.fmt(payFor(t, S.amount))}</span><span class="cur">UZS</span></span>${S.loading ? '<span class="skeleton"></span>' : ''}
        </div>
      </div>
    </div>`;
  });
  // «Кнопка становится активной после подгрузки сумм» — Rule dev, Калькулятор 3.0
  $('#get-money').disabled = S.loading;
}

function loadPayments(ms = 900) {
  S.loading = true; render();
  clearTimeout(loadPayments.t); loadPayments.t = setTimeout(() => { S.loading = false; render(); }, ms);
}

// Ввод суммы: только цифры, не больше одобренной
input.addEventListener('input', () => {
  let v = P.num(input.value);
  const max = SCEN[S.scen].approved;
  if (v > max) v = max;
  S.amount = v;
  input.value = v ? P.fmt(v) : '';
  $('#slot').textContent = `Вы оформляете микрозайм на сумму ${P.fmt(v)} UZS`;
});
// Ввод суммы: пока клавиатура открыта, срок не выбран (кадр 68516:41004)
input.addEventListener('focus', () => { if (!S.editing) { S.editing = true; render(); } });
// Сумма введена (клавиатура закрыта): пересчёт платежей со скелетоном, как в кадре 68516:39117
input.addEventListener('proto:done', () => {
  S.editing = false;
  if (!S.amount) S.amount = lastValid;
  if (S.amount === lastValid) return render();
  lastValid = S.amount; loadPayments();
});
document.querySelector('.input-text').addEventListener('click', () => input.focus());

P.on('term', el => { S.term = Number(el.dataset.m); render(); });

const set = o => () => { clearTimeout(loadPayments.t); Object.assign(S, { scen: 'A', amount: 10000000, term: 36, loading: false, editing: false }, o); lastValid = S.amount; render(); P.reset('offer', null); };
P.states([
  { id: 'default',  group: 'Основной флоу', title: 'Предложение по умолчанию', figma: '68516:39019', node: '68516:39019', height: 844, apply: set({}) },
  { id: 'keyboard', group: 'Основной флоу', title: 'Ввод суммы', figma: '68516:41004', node: '68516:41004', height: 844, apply: () => { set({ editing: true })(); P.keyboard.show(input); } },
  { id: 'loading',  group: 'Сценарии', title: 'Одобрено 2 000 000: пять сроков, загрузка', figma: '68516:39117', node: '68516:39117', height: 1001, apply: () => { set({ scen: 'B', amount: 1000000 })(); loadPayments(1500); } },
  { id: 'amount-3m', group: 'Сроки по сумме', title: '3 000 000 → 4 срока', apply: set({ amount: 3000000 }) },
  { id: 'amount-4m', group: 'Сроки по сумме', title: '4 000 000 → 3 срока', apply: set({ amount: 4000000 }) },
  { id: 'amount-7m', group: 'Сроки по сумме', title: '7 000 000 → 2 срока', apply: set({ amount: 7000000 }) },
]);
render();
P.start('offer');
</script>
</body>
</html>
